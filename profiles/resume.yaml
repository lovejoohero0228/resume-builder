emphasis:
  - ownership-e2e
  - modeling-foundation
  - engineering-craft
  - research-depth
  - stakeholder-alignment
  - shipping-delivery
  - performance-optimization

resume:
  include:
    - 00_identity
    - 01_skills
    - 10_experience/e01
    - 10_experience/e02
    - 10_experience/e03
    - 02_education
  project_order: [p01, p02, p13, p05, p12, p11, p08, p09, p10, p03, p06, p07]
  max_bullets_per_job: 8
