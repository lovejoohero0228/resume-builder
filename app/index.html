<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>career-master · GUI</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--fg:#e6e9ef;--mut:#9aa4b2;--acc:#5b9dff;--good:#3fb950;--warn:#d29922;--bad:#f85149}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .tabs button{background:transparent;color:var(--mut);border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}
  .tabs button.on{background:var(--panel2);color:var(--fg)}
  .status{margin-left:auto;font-size:12px;color:var(--mut)}
  main{padding:0}
  .view{display:none;padding:16px;gap:16px}
  .view.on{display:flex}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
  button.act{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit}
  textarea{width:100%;height:calc(100vh - 190px);resize:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
  .filelist{list-style:none;margin:0;padding:0}
  .filelist li{padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--mut);font-size:13px;white-space:nowrap}
  .filelist li:hover{background:var(--panel2)}
  .filelist li.on{background:var(--panel2);color:var(--fg)}
  .filelist .grp{color:#6b7280;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:10px 4px 4px;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px}
  .chk:hover{background:var(--panel2)}
  .badge{font-size:11px;padding:1px 7px;border-radius:20px;background:#243; color:#8fd694;border:1px solid #2f5}
  .badge.mut{background:var(--panel2);color:var(--mut);border-color:var(--line)}
  .ord{display:flex;flex-direction:column}
  .ord button{background:transparent;border:0;color:var(--mut);cursor:pointer;line-height:1;font-size:11px;padding:0 4px}
  .item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;border:1px solid transparent}
  .item:hover{border-color:var(--line)}
  .muted{color:var(--mut)}
  .warns{font-size:12px;color:var(--warn)}
  .errs{font-size:12px;color:var(--bad)}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
  label.fld input,label.fld select{color:var(--fg)}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  /* preview markdown */
  .md{background:#fff;color:#111;border-radius:8px;padding:0}
  .md .page{padding:40px 46px;min-height:200px}
  .md .page + .page{border-top:8px solid #eef}
  .md h1{font-size:24px;margin:.2em 0 .1em;border-bottom:2px solid #222;padding-bottom:6px}
  .md h2{font-size:17px;margin:1.1em 0 .3em;color:#0b3}
  .md h2{color:#123}
  .md h3{font-size:15px;margin:1em 0 .2em}
  .md h4{font-size:13px;margin:.8em 0 .2em;color:#333}
  .md p{margin:.4em 0}
  .md ul,.md ol{margin:.3em 0 .3em 1.2em;padding:0}
  .md li{margin:.15em 0}
  .md table{border-collapse:collapse;margin:.6em 0;font-size:13px;width:100%}
  .md th,.md td{border:1px solid #ccc;padding:5px 8px;text-align:left;vertical-align:top}
  .md th{background:#f3f5f8}
  .md blockquote{margin:.5em 0;padding:.3em .9em;border-left:3px solid #cbd5e1;color:#475569;background:#f8fafc}
  .md code{background:#eef1f5;padding:1px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}
  .md pre{background:#f3f5f8;padding:10px 12px;border-radius:8px;overflow:auto}
  .md hr{border-top:1px solid #e2e8f0}
  .md a{color:#1a56db;text-decoration:none}
  .previewbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .grow{flex:1}
  /* 미리보기 col은 overflow를 풀어 포트폴리오 좌측 목차(sticky)가 뷰포트에 고정되게 */
  #view-preview>.col{overflow:visible}
  .subtabs{display:flex;gap:6px;margin-bottom:14px}
  .subtabs button{background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:9px;padding:8px 18px;cursor:pointer;font-weight:600;font-size:14px}
  .subtabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  /* 조립: 좌 선택 / 우 순서 미리보기 2분할 */
  .asm-split{display:flex;gap:0;flex:1;min-height:0}
  .asm-select,.asm-preview{flex:1 1 50%;min-width:0;overflow:auto;padding:2px 14px 8px}
  .asm-select{padding-left:2px}
  .asm-preview{border-left:1px solid var(--line)}
  .pane-cap{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--fg);position:sticky;top:0;background:var(--panel);padding:6px 0 10px;margin-bottom:2px;z-index:3;border-bottom:1px solid var(--line)}
  .capnote{font-weight:400;color:var(--mut);font-size:11.5px;margin-left:2px}
  .sel-h,.pv-h{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.02em;color:var(--fg);margin:16px 0 8px;font-weight:800}
  .sel-h::before,.pv-h::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--acc);flex:0 0 auto}
  .sel-h:first-child,.pv-h:first-child{margin-top:6px}
  .selgrid{display:flex;flex-wrap:wrap;gap:6px}
  .selbulk{display:flex;gap:6px;margin:2px 0 4px}
  .bulkbtn{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:7px;cursor:pointer;font-size:11.5px;font-weight:700;line-height:1;padding:5px 10px;transition:.12s}
  .bulkbtn:hover{border-color:var(--acc);color:var(--fg)}
  .draglist{display:flex;flex-direction:column;gap:6px;min-height:34px;border-radius:10px}
  .draglist.dragover{outline:1.5px dashed var(--acc);outline-offset:3px}
  .draglist.empty{border:1px dashed var(--line);align-items:center;justify-content:center}
  .draglist.empty::after{content:'← 왼쪽에서 체크하면 여기 표시';color:#5b6270;font-size:12px;padding:9px}
  .dragcard{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px 7px 11px;cursor:grab;font-size:13.5px;transition:border-color .12s,box-shadow .12s,opacity .12s}
  .dragcard:hover{border-color:#3d6bb0;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .dragcard.dragging{opacity:.35;cursor:grabbing}
  .dragcard.isoff{opacity:.5;background:var(--panel)}
  .dragcard.isoff .dc-title{text-decoration:line-through;text-decoration-color:var(--mut)}
  .dragcard .gh{color:#5f6b7a;font-size:14px;cursor:grab;line-height:1;letter-spacing:-2px;flex:0 0 auto}
  .dragcard .dc-body{flex:1;min-width:0}
  .dragcard .dc-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dragcard .dc-sub{font-size:11.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 태그(비클릭): 알약 아님을 분명히 — 각지고, hover·cursor 없음 */
  .dragcard .dc-kind{font-size:10px;font-weight:700;color:var(--mut);background:transparent;border:0;border-left:2px solid var(--line);border-radius:0;padding:0 0 0 8px;flex:0 0 auto;cursor:default;text-transform:uppercase;letter-spacing:.04em}
  .dragcard .dc-kind.exp{color:#9dc0f0;border-left-color:#3d6bb0}
  /* mini 버튼: 실제 버튼처럼 */
  .dragcard .mini{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:6px;cursor:pointer;font-size:10.5px;font-weight:700;line-height:1;padding:4px 7px;transition:.12s}
  .dragcard .mini:hover{border-color:var(--acc);color:var(--fg);background:var(--panel2)}
  .dragcard .bexp{color:var(--acc);padding:4px 6px;font-size:11px}
  .dragcard .beye.on{border-color:var(--warn);color:var(--warn)}
  .dragcard .bexcl:hover{border-color:var(--bad);color:var(--bad)}
  /* 불렛 편집 패널 */
  .bulletpanel{margin:-1px 0 6px 20px;border-left:2px solid var(--acc);padding:8px 0 10px 12px;background:linear-gradient(90deg,rgba(91,157,255,.06),transparent 60%);border-radius:0 8px 8px 0}
  .bp-head{font-size:11px;color:var(--acc);margin:6px 0 7px;font-weight:800;letter-spacing:.02em}
  .bp-head:first-child{margin-top:0}
  .bp-load{font-size:12px;color:var(--mut);padding:6px 2px;line-height:1.5}
  .draglist.bullets{gap:5px}
  .dragcard.bcard{background:var(--panel);padding:7px 8px 7px 10px;font-size:12.5px;align-items:flex-start}
  .dragcard.bcard .gh{margin-top:1px}
  .dragcard.bcard .dc-title{white-space:normal;line-height:1.45}
  .dragcard.bcard .dc-kind,.dragcard.bcard .mini{margin-top:1px}
  .prow{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:7px 0;background:var(--panel)}
  .prow.inc{border-color:#3d6bb0;background:#141c28}
  .prow .ptop{display:flex;align-items:center;gap:9px}
  .prow .ptitle{flex:1;font-size:13.5px}
  .prow .angs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-left:30px}
  .angchip{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);cursor:pointer;user-select:none;transition:.12s}
  .angchip:hover{border-color:var(--acc);color:var(--fg)}
  .angchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>career-master</h1>
  <div class="tabs">
    <button data-tab="source" class="on">소스 편집</button>
    <button data-tab="assemble">공고 조립</button>
    <button data-tab="preview">미리보기 · Export</button>

  <div class="status" id="status"></div>
</header>
<main>

            <div class="sel-h">섹션</div><div id="resSecSel" class="selgrid"></div>

            <div id="resBlockPv" class="draglist"></div>

</main>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const state={cat:null, result:null,
  emphasisOrder:[], emphasisOn:new Set(),
  projOrder:[], projResume:new Set(), projPort:new Set(),
  plainResume:new Set(['00_identity','01_skills','02_education']),
  expResume:new Set(),
  plainPort:new Set(['00_identity','90_appendix'])};

async function getJSON(u){const r=await fetch(u);return r.json();}
async function postJSON(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json();}
function setStatus(t){$('#status').textContent=t;}

/* ---------- minimal markdown → html ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(https?:\/\/[^\s<)]+)(?![^<]*<\/a>)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md2html(md){
  const lines=(md||'').replace(/\r/g,'').split('\n');
  let html='',i=0,list=null;
  const closeList=()=>{if(list){html+=`</${list}>`;list=null;}};
  while(i<lines.length){
    let ln=lines[i];
    if(/^\s*$/.test(ln)){closeList();i++;continue;}
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){closeList();const l=m[1].length;html+=`<h${l}>${inline(m[2])}</h${l}>`;i++;continue;}
    if(/^---+\s*$/.test(ln)){closeList();html+='<hr>';i++;continue;}
    if(/^\s*>\s?/.test(ln)){closeList();let q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}html+=`<blockquote>${inline(q.join(' '))}</blockquote>`;continue;}
    // table
    if(ln.includes('|')&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      closeList();
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(ln);i+=2;let rows=[];
      while(i<lines.length&&lines[i].includes('|')&&!/^\s*$/.test(lines[i])){rows.push(cells(lines[i]));i++;}
      html+='<table><thead><tr>'+head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    const cont=k=>k<lines.length&&lines[k].trim()&&!/^\s*[-*]\s+/.test(lines[k])&&!/^\s*\d+\.\s+/.test(lines[k])&&!/^#{1,6}\s/.test(lines[k])&&!/^\s*>/.test(lines[k])&&!lines[k].includes('|');
    if(m=ln.match(/^\s*[-*]\s+(.*)$/)){if(list!=='ul'){closeList();list='ul';html+='<ul>';}let t=m[1];i++;while(cont(i)){t+=' '+lines[i].trim();i++;}html+=`<li>${inline(t)}</li>`;continue;}
    if(m=ln.match(/^\s*\d+\.\s+(.*)$/)){if(list!=='ol'){closeList();list='ol';html+='<ol>';}let t=m[1];i++;while(cont(i)){t+=' '+lines[i].trim();i++;}html+=`<li>${inline(t)}</li>`;continue;}
    closeList();
    let para=[ln];i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|>|\s*[-*]\s|\s*\d+\.\s|---+\s*$)/.test(lines[i])&&!(lines[i].includes('|'))){para.push(lines[i]);i++;}
    html+=`<p>${inline(para.join(' '))}</p>`;
  }
  closeList();return html;
}

/* ---------- Resume 1 형식 (docx: Arial · 좌측 · 남색 #153D63) ---------- */
const R1CSS=`
.r1{font-family:Arial,'Helvetica Neue',sans-serif;color:#111;font-size:9.4pt;line-height:1.42}
.r1 .name{font-size:18pt;font-weight:700;margin:0}

`;
function mb(s){return esc(s||'').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function trimLead(s){s=(s||'').replace(/\s+/g,' ').trim();const m=s.match(/^[^.。!?\n]+[.。!?]?/);let t=m?m[0]:s;if(t.length>120)t=t.slice(0,118)+'…';return t;}
// 프로젝트 본문에서 '문제 정의' 섹션만 추출 (없으면 첫 ## 섹션)
function problemDef(bodyMd){
  const lines=(bodyMd||'').replace(/\r/g,'').split('\n');
  let start=-1;
  for(let k=0;k<lines.length;k++){if(/^##\s+/.test(lines[k])&&/문제\s*정의|problem/i.test(lines[k])){start=k;break;}}
  if(start<0)for(let k=0;k<lines.length;k++){if(/^##\s+/.test(lines[k])){start=k;break;}}
  if(start<0)return '';
  let end=lines.length;
  for(let k=start+1;k<lines.length;k++){if(/^##\s+/.test(lines[k])){end=k;break;}}
  return lines.slice(start+1,end).join('\n').trim();
}
// 나의 역할 그룹 → 위계 불렛 (라벨=상위, items=하위 불렛)
function roleGroupsHtml(groups){
  return (groups||[]).filter(g=>!g.hidden).map(g=>{
    if(g.label){
      const subs=(g.items||[]).map(t=>`<div class="kpoint sub">${mb(t)}</div>`).join('');
      return `<div class="kgroup">${esc(g.label)}</div>${subs}`;
    }
    return (g.items||[]).map(t=>`<div class="kpoint">${mb(t)}</div>`).join('');
  }).join('');
}
// 역할 범위 → 태그 (리드 / 주도 / 단독 / 참여 …) + 상세
function roleScope(role,isKo){
  // 역할은 두 가지로만: 참여 → 프로젝트 참여, 그 외(리드·주도·단독 등) → 프로젝트 리더
  if(/참여|contributor/i.test(role||'')) return isKo?'프로젝트 참여':'Project Contributor';
  return isKo?'프로젝트 리더':'Project Lead';
}
function roleTagHtml(role,isKo){
  if(!role) return '';
  const scope=roleScope(role,isKo);
  // 괄호 밖(pre) / 안(paren) 분리 후, 칩과 겹치는 범위어를 제거 → 괄호 없이 detail 구성
  const m=role.match(/^([^(（]*)[(（]([^)）]*)[)）]?/);
  const pre=(m?m[1]:role), paren=(m?m[2]:'');
  const TRIG=/리드|리더|주도|단독|참여|Lead|Sole|Drove|Contributor/i;
  const preRest=pre.replace(TRIG,'').replace(/\s+/g,' ').replace(/^[·,\s]+|[·,\s]+$/g,'').trim();
  const detail=[preRest, paren.trim()].filter(Boolean).join(' · ');
  return `<div class="roletag"><span class="rt-chip">${esc(scope)}</span>${detail?`<span class="rt-detail">${esc(detail)}</span>`:''}</div>`;
}
// 문제 정의 → 풀고자 한 문제 / 제약·난점 2분할
function problemHtml(pb,isKo){
  const row=(lab,txt)=>txt?`<div class="pdsub"><span class="pdlabel">${lab}</span><div class="pdbody">${isKo?md2html(txt):`<p>${mb(txt)}</p>`}</div></div>`:'';
  return row(isKo?'풀고자 한 문제':'Goal', pb.goal)+row(isKo?'제약과 어려움':'Constraints & hurdles', pb.hurdle);
}
function resumeInner(rs){
  if(!rs) return '<div class="r1">데이터 없음 — 조립하세요.</div>';
  const L=(rs.lang==='ko')?{p:'프로필',s:'기술 스택',e:'경력'}:{p:'Profile',s:'Technical Skills',e:'Experience'};
  const id=rs.identity||{};
  const blk={
    identity(){ if(!rs.identity)return '';
      let s=`<div class="name">${esc(id.name||'')}</div>`;
      if(id.tagline)s+=`<div class="tag">${esc(id.tagline)}</div>`;
      if(id.contact)s+=`<div class="contact">${esc(id.contact)}</div>`;
      if(id.summary)s+=`<h2>${L.p}</h2><p class="prof">${mb(id.summary)}</p>`;
      return s;
    },
    skills(){ const vis=(rs.skills||[]).filter(s=>!s.hidden); if(!vis.length)return '';
      return `<h2>${L.s}</h2>`+vis.map(s=>`<div class="skill">${s.label?`<b>${esc(s.label)}</b>&nbsp;&nbsp;`:''}${mb(s.rest)}</div>`).join('');
    },
    education(){ return (rs.education||[]).map(g=>
      `<h2>${esc(g.title)}</h2>`+g.items.map(it=>`<div class="edu${it.sub?' sub':''}">${mb(it.text)}</div>`).join('')).join('');
    }
  };
  const exps=rs.experiences||[]; let ei=0, expHeader=false;
  const expBlock=()=>{ if(ei>=exps.length)return '';
    const e=exps[ei++]; let s='';
    if(!expHeader){s+=`<h2>${L.e}</h2>`;expHeader=true;}
    const meta=[e.title,e.period,e.location].filter(Boolean).map(esc).join(' · ');
    s+=`<div class="job"><span class="co">${esc(e.company)}</span>${meta?` <span class="meta">— ${meta}</span>`:''}`;
    if(e.context)s+=`<div class="ti">${mb(e.context)}</div>`;
    if(e.bullets&&e.bullets.length)s+='<ul>'+e.bullets.map(b=>`<li>${mb(b)}</li>`).join('')+'</ul>';
    return s+'</div>';
  };
  let order=(rs.order&&rs.order.length)?rs.order:['identity','skills','experience','education'];
  if(order.indexOf('experience')<0&&exps.length)order=order.concat(Array(exps.length).fill('experience'));
  let h='<div class="r1">';
  order.forEach(tok=>{ h+= tok==='experience'?expBlock():(blk[tok]?blk[tok]():''); });
  return h+'</div>';
}

function pfInit(root){
  root=root||document;
  // 프로젝트 다이어그램 로드: 성공 시 placeholder 교체, 실패면 placeholder 유지
  root.querySelectorAll('.figure[data-src]').forEach(function(fig){
    var src=fig.getAttribute('data-src'),cap=fig.getAttribute('data-cap')||'';
    var img=new Image();
    img.onload=function(){
      fig.classList.add('has-img');fig.textContent='';
      img.className='figimg';img.setAttribute('alt',cap);
      img.addEventListener('click',function(){window.open(img.src,'_blank');});
      fig.appendChild(img);
    };
    img.onerror=function(){/* 파일 없으면 placeholder 유지 */};
    img.src=src;
  });
  // 카드 썸네일: 대표 이미지(첫 장) 로드, 실패 시 기존 placeholder 유지
  root.querySelectorAll('.thimg[data-src]').forEach(function(el){
    var src=el.getAttribute('data-src');
    var img=new Image();
    img.onload=function(){el.classList.add('has-img');el.style.backgroundImage="url('"+src+"')";el.textContent='';};
    img.onerror=function(){/* 파일 없으면 placeholder 유지 */};
    img.src=src;
  });
  var bars=root.querySelectorAll('.bfill');
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.style.width=(e.target.getAttribute('data-pct')||0)+'%';io.unobserve(e.target);}});},{threshold:.25});
  bars.forEach(function(b){io.observe(b);});
  var items=[].slice.call(root.querySelectorAll('.tocitem')),map={};
  items.forEach(function(a){map[a.getAttribute('href').slice(1)]=a;});
  var so=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){items.forEach(function(l){l.classList.remove('on');});var a=map[e.target.id];if(a)a.classList.add('on');}});},{rootMargin:'-6% 0px -80% 0px'});
  root.querySelectorAll('.main [id]').forEach(function(s){so.observe(s);});
  var tt=root.querySelector('.totop');
  if(tt){var sc=function(){(window.scrollY>300)?tt.classList.add('show'):tt.classList.remove('show');};window.addEventListener('scroll',sc);sc();tt.addEventListener('click',function(ev){ev.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});}
  var fb=[].slice.call(root.querySelectorAll('.filters button')),th=[].slice.call(root.querySelectorAll('.thumb'));
  fb.forEach(function(b){b.addEventListener('click',function(){fb.forEach(function(x){x.classList.remove('on');});b.classList.add('on');var f=b.getAttribute('data-filter');th.forEach(function(t){var tags=t.getAttribute('data-tags')||'';t.style.display=(f==='*'||tags.indexOf('|'+f+'|')>=0)?'':'none';});});});
}

// 파일명 → 사람이 읽을 캡션 (확장자 제거·언더스코어 정리)
function diagCap(fn){
  return fn.replace(/\.(png|jpe?g|webp|svg|gif)$/i,'')
           .replace(/\.(png|jpe?g|webp|svg|gif)$/i,'')
           .replace(/_/g,' ').replace(/\s+/g,' ').trim();
}
function figureHtml(p, isKo){
  const ORIGIN=(typeof location!=='undefined')?location.origin:'';
  const files=DIAGRAMS[p.id]||[];
  if(!files.length)return '';   // 이미지 없는 프로젝트는 placeholder 없이 영역 자체를 생략
  return files.map(function(fn){
    const src=ORIGIN+'/assets/diagrams/'+encodeURIComponent(fn);
    const cap=esc(files.length>1?diagCap(fn):p.title);   // 여러 장이면 파일명으로 구분
    const ph=`<div class="fig-ph"><div>🖼</div><div class="fmid">${isKo?'이미지 / 다이어그램':'image / diagram'}</div><div class="fcap">${cap}</div></div>`;
    return `<figure class="figure" data-src="${src}" data-cap="${cap}">${ph}</figure>`;
  }).join('');
}

            :(problem?`<div class="kh">${L.prob}</div><div class="cbody pdef">${isKo?md2html(problem):`<p>${mb(problem)}</p>`}</div>`:'')}

      </section>`;
      navProjects+=`<a class="tocitem sub" href="#${id}"><span class="num">${num}</span><span class="txt">${esc(p.title)}</span></a>`;
    }else{

let curFile=null;
function buildFileList(){
  const ul=$('#filelist');ul.innerHTML='';
  const groups={'정체성/스킬/학력':[], '경력':[], '프로젝트':[], '방법론/부록':[], '프로필':[]};
  state.cat.files.forEach(f=>{
    let g='방법론/부록';
    if(f.startsWith('profiles/'))g='프로필';
    else if(f.includes('/10_experience/'))g='경력';
    else if(f.includes('/20_projects/'))g='프로젝트';
    else if(/00_identity|01_skills|02_education/.test(f))g='정체성/스킬/학력';
    groups[g].push(f);
  });
  Object.entries(groups).forEach(([g,fs])=>{
    if(!fs.length)return;
    const gl=document.createElement('li');gl.className='grp';gl.textContent=g;ul.appendChild(gl);
    fs.forEach(f=>{const li=document.createElement('li');li.textContent=f.replace(/^source\//,'').replace(/^profiles\//,'▸ ');
      li.dataset.path=f;li.onclick=()=>openFile(f,li);ul.appendChild(li);});
  });
}
async function openFile(path,li){
  const d=await getJSON('/api/file?path='+encodeURIComponent(path));
  if(d.error){setStatus('열기 실패');return;}
  curFile=path;$$('.filelist li').forEach(x=>x.classList.remove('on'));li&&li.classList.add('on');
  $('#editpath').textContent='· '+path;$('#editor').value=d.content;$('#saveBtn').disabled=false;$('#saveMsg').textContent='';
  renderSrcPrev();
}
function renderSrcPrev(){
  let t=$('#editor').value;
  // strip yaml frontmatter for preview of .md; show yaml raw for profiles
  if(curFile&&curFile.endsWith('.md')){t=t.replace(/^---[\s\S]*?\n---\n?/,'');}
  $('#srcPrev').innerHTML=md2html(t);
}
$('#editor').addEventListener('input',renderSrcPrev);
$('#saveBtn').onclick=async()=>{
  if(!curFile)return;
  const r=await postJSON('/api/file',{path:curFile,content:$('#editor').value});
  $('#saveMsg').textContent=r.ok?'저장됨 ✓':'실패: '+(r.error||'');

/* 공통 드래그 정렬: 컨테이너의 '직접 자식' .dragcard 만 재배치 → onDrop(newTokenOrder) */
function enableDrag(container,onDrop,onStart){
  let dragEl=null;
  container.querySelectorAll(':scope > .dragcard').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragEl=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',el.dataset.tok||'');}catch(_){} if(onStart)onStart();});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');container.classList.remove('dragover');
      const order=[...container.querySelectorAll(':scope > .dragcard')].map(x=>x.dataset.tok);dragEl=null;onDrop(order);});
  });
  container.ondragover=e=>{ if(!dragEl)return; e.preventDefault(); container.classList.add('dragover');
    const els=[...container.querySelectorAll(':scope > .dragcard:not(.dragging)')];
    let after=null,min=Infinity;
    for(const c of els){const b=c.getBoundingClientRect();const off=e.clientY-(b.top+b.height/2);if(off<0&&-off<min){min=-off;after=c;}}
    if(after)container.insertBefore(dragEl,after); else container.appendChild(dragEl);
  };
  container.ondragleave=e=>{if(e.target===container)container.classList.remove('dragover');};
}
function dragCard(tok,title,opts){
  opts=opts||{};
  const el=document.createElement('div');
  el.className='dragcard'+(opts.cls?(' '+opts.cls):'')+(opts.hidden?' isoff':'');
  el.draggable=true; el.dataset.tok=tok;
  el.innerHTML=`<span class="gh" title="드래그로 이동">⠿</span>`
    +(opts.expandable?`<button class="mini bexp" draggable="false" title="세부 편집">${opts.open?'▾':'▸'}</button>`:'')
    +`<div class="dc-body"><div class="dc-title">${esc(title)}</div>${opts.sub?`<div class="dc-sub">${esc(opts.sub)}</div>`:''}</div>`
    +(opts.kind?`<span class="dc-kind ${opts.kindCls||''}">${esc(opts.kind)}</span>`:'')
    +(opts.hideable?`<button class="mini beye${opts.hidden?' on':''}" draggable="false" title="표시/숨김">${opts.hidden?'숨김':'표시'}</button>`:'')

function selectProjectRow(mode,pid){
  const p=pj(pid), st=state[mode], inc=st.inc.has(pid);
  const el=document.createElement('div'); el.className='prow'+(inc?' inc':'');
  const angchips=(p.variant_angles.length?p.variant_angles:['—']).map(a=>
    a==='—'?'<span class="muted" style="font-size:12px">변형 없음</span>'
    :`<span class="angchip ${(st.angles[pid]||[]).includes(a)?'on':''}" data-ang="${a}">${a}</span>`).join('');
  el.innerHTML=`<div class="ptop">
      <input type="checkbox" data-inc ${inc?'checked':''}>
      <div class="ptitle"><b>${pid}</b> ${esc(p.title_ko)} <span class="muted" style="font-size:12px">${p.tags.join(' · ')}</span></div>
    </div>
    <div class="angs">${angchips}</div>`;
  el.querySelector('[data-inc]').onchange=e=>{
    if(e.target.checked){st.inc.add(pid);
      if(!(st.angles[pid]&&st.angles[pid].length))
        st.angles[pid]=(mode==='resume')?p.variant_angles.slice(0,1):p.variant_angles.slice();

    renderMode(mode);

}

/* ----- 모두 선택 / 모두 해제 ----- */
function selectAll(mode,on){
  if(mode==='resume'){
    const R=state.resume;
    ['00_identity','01_skills','02_education'].forEach(s=>on?R.plain.add(s):R.plain.delete(s));
    state.cat.experiences.forEach(e=>on?R.exp.add(e.sid):R.exp.delete(e.sid));
    state.projOrder.forEach(pid=>{
      if(on){R.inc.add(pid); const p=pj(pid);
        if(!(R.angles[pid]&&R.angles[pid].length))R.angles[pid]=p.variant_angles.slice(0,1);}
      else R.inc.delete(pid);
    });
  }else{
    const P=state.portfolio;
    ['00_identity','90_appendix'].forEach(s=>on?P.plain.add(s):P.plain.delete(s));
    P.skillsOn=on;
    state.projOrder.forEach(pid=>{
      if(on){P.inc.add(pid); const p=pj(pid);
        if(!(P.angles[pid]&&P.angles[pid].length))P.angles[pid]=p.variant_angles.slice();}
      else P.inc.delete(pid);
    });
  }
  renderMode(mode);
}

    if(R[tok])return{title:R[tok],kind:'섹션'};
    const e=state.cat.experiences.find(x=>x.sid===tok);
    return{title:(e?e.company_ko:tok),kind:'경력',kindCls:'exp',sub:(e?[e.title_ko,tok.split('/')[1]].filter(Boolean).join(' · '):tok.split('/')[1])};
  }
  const cnt=state.projOrder.filter(p=>state.portfolio.inc.has(p)).length;
  const M={about:{title:'소개',kind:'섹션'},skills:{title:'기술 스택',kind:'섹션'},
           projects:{title:'프로젝트',kind:'섹션',sub:cnt+'개 카드'},appendix:{title:'부록',kind:'섹션'}};
  return M[tok]||{title:tok,kind:'섹션'};
}
function blockOn(mode,tok){
  if(mode==='resume'){
    if(tok.indexOf('10_experience/')===0)return state.resume.exp.has(tok);
    return state.resume.plain.has(tok);
  }
  const P=state.portfolio;
  if(tok==='about')return P.plain.has('00_identity');
  if(tok==='skills')return P.skillsOn!==false;
  if(tok==='projects')return state.projOrder.some(p=>P.inc.has(p));
  if(tok==='appendix')return P.plain.has('90_appendix');
  return false;
}

function excludeBlock(mode,t){

/* 공통 세부 항목 에디터: 드래그 정렬 + 표시/숨김. items=[{key,title,sub,kind,kindCls,hidden}] */
function renderEditor(container,items,onChange){
  container.innerHTML='';
  container.classList.toggle('empty',items.length===0);
  items.forEach(it=>{
    const card=dragCard(it.key,it.title,{kind:it.kind,kindCls:it.kindCls,sub:it.sub,cls:'bcard',hideable:true,hidden:it.hidden});
    container.appendChild(card);
    card.querySelector('.beye').onclick=e=>{e.stopPropagation();it.hidden=!it.hidden;sync();renderEditor(container,items,onChange);};
  });
  function sync(){
    const dom=[...container.querySelectorAll(':scope > .dragcard')].map(c=>c.dataset.tok);
    const by={}; items.forEach(x=>by[x.key]=x);
    const seq=dom.map(k=>by[k]).filter(Boolean);
    if(seq.length===items.length){items.length=0;items.push(...seq);}
    onChange(items);
  }
  enableDrag(container,()=>{sync();renderEditor(container,items,onChange);});
}
function editorHead(text){const h=document.createElement('div');h.className='bp-head';h.textContent=text;return h;}
function editorList(){const l=document.createElement('div');l.className='draglist bullets';return l;}

/* 경력 카드 펼침 → 실제 조립된 불렛을 가져와 드래그 정렬 + 숨김 */
async function loadBullets(sid,panel){
  panel.innerHTML='<div class="bp-load">불렛 불러오는 중…</div>';
  let r; try{ r=await postJSON('/api/assemble',currentProfile()); }catch(_){ panel.innerHTML='<div class="bp-load">불러오기 실패</div>'; return; }
  if(state.resume._openBlock!==sid)return;
  const lang=(r.langs&&r.langs[0])||'ko';
  const exps=((r.resume_struct||{})[lang]||{}).experiences||[];
  if(exps.length&&exps.every(e=>e.bullet_items===undefined)){
    panel.innerHTML='<div class="bp-load">⚠ 서버(build.py)가 최신이 아닙니다. 터미널에서 서버를 <b>재시작</b>한 뒤 다시 열어주세요.</div>';return;
  }
  const exp=exps.find(e=>e.sid===sid);
  if(!exp){panel.innerHTML='<div class="bp-load">이 경력이 이력서에 포함돼 있지 않습니다 — 왼쪽에서 체크하세요.</div>';return;}
  const bi=exp.bullet_items||[];
  if(!bi.length){panel.innerHTML='<div class="bp-load">정렬할 불렛이 없습니다 — 왼쪽에서 프로젝트를 포함하거나 소스에 불렛을 추가하세요.</div>';return;}
  panel.innerHTML=''; panel.appendChild(editorHead('불렛 — 드래그 정렬 · 표시/숨김'));
  const list=editorList(); panel.appendChild(list);
  const norm=bi.map(it=>({key:it.key,title:it.text,kind:it.key.indexOf('x:')===0?'직접':'프로젝트',kindCls:it.key.indexOf('x:')===0?'':'exp',hidden:!!it.hidden}));
  renderEditor(list,norm,arr=>{
    state.resume.bulletOrder[sid]=arr.map(x=>x.key);
    state.resume.bulletHidden[sid]=arr.filter(x=>x.hidden).map(x=>x.key);
  });
}
/* 포폴 프로젝트 카드 펼침 → 나의 역할(그룹) + 주요 성과(개별) 정렬·숨김 */
async function loadPortBullets(pid,panel){
  panel.innerHTML='<div class="bp-load">불렛 불러오는 중…</div>';
  let r; try{ r=await postJSON('/api/assemble',currentProfile()); }catch(_){ panel.innerHTML='<div class="bp-load">불러오기 실패</div>'; return; }
  if(state.portfolio._openProj!==pid)return;
  const lang=(r.langs&&r.langs[0])||'ko';
  const part=(((r.portfolio_parts||{})[lang])||[]).find(x=>x.kind==='project'&&x.id===pid);
  if(!part){panel.innerHTML='<div class="bp-load">이 프로젝트가 포폴에 포함돼 있지 않습니다 — 왼쪽에서 체크하세요.</div>';return;}
  const groups=part.role_groups||[], impact=part.impact||[];
  if((groups.length&&groups.every(g=>g.key===undefined))||(impact.length&&impact.every(i=>i.key===undefined))){
    panel.innerHTML='<div class="bp-load">⚠ 서버(build.py)가 최신이 아닙니다. 터미널에서 서버를 <b>재시작</b>한 뒤 다시 열어주세요.</div>';return;
  }
  if(!groups.length&&!impact.length){panel.innerHTML='<div class="bp-load">이 카드에는 정렬할 불렛이 없습니다.</div>';return;}
  panel.innerHTML='';
  const gnorm=groups.map(g=>({key:g.key,title:g.label||'(그룹)',kind:'그룹',kindCls:'exp',sub:((g.items||[]).length)+'개 항목',hidden:!!g.hidden}));
  const inorm=impact.map(f=>({key:f.key,title:f.value,kind:f.kind==='metric'?'지표':'도입',hidden:!!f.hidden}));
  const commit=()=>{
    state.portfolio.bulletOrder[pid]=[...gnorm.map(x=>x.key),...inorm.map(x=>x.key)];
    state.portfolio.bulletHidden[pid]=[...gnorm.filter(x=>x.hidden).map(x=>x.key),...inorm.filter(x=>x.hidden).map(x=>x.key)];
  };
  if(gnorm.length){panel.appendChild(editorHead('나의 역할 — 그룹 정렬 · 표시/숨김'));const gl=editorList();panel.appendChild(gl);renderEditor(gl,gnorm,commit);}
  if(inorm.length){panel.appendChild(editorHead('주요 성과 — 정렬 · 표시/숨김'));const il=editorList();panel.appendChild(il);renderEditor(il,inorm,commit);}
}
/* 기술 스택 펼침 → 스킬 그룹 정렬·숨김 (이력서·포폴 공용) */

function currentProfile(){
  const R=state.resume,P=state.portfolio;
  // 이력서 include = 사용자가 정한 순서대로, 포함된 것만
  const rinc=[];
  (R.order||[]).forEach(tok=>{
    if(tok.indexOf('10_experience/')===0){if(R.exp.has(tok))rinc.push(tok);}
    else if(R.plain.has(tok))rinc.push(tok);
  });
  const rProj=state.projOrder.filter(p=>R.inc.has(p));
  const rAng={}; rProj.forEach(p=>{if((R.angles[p]||[]).length)rAng[p]=R.angles[p];});
  const pinc=[]; if(P.plain.has('00_identity'))pinc.push('00_identity');
  state.projOrder.forEach(p=>{if(P.inc.has(p))pinc.push(pj(p).sid);});
  if(P.plain.has('90_appendix'))pinc.push('90_appendix');
  const pAng={}; state.projOrder.forEach(p=>{if(P.inc.has(p)&&(P.angles[p]||[]).length)pAng[p]=P.angles[p];});
  // 포폴 섹션 순서 = 사용자가 정한 순서, 포함된 블록만
  const hasProj=state.projOrder.some(p=>P.inc.has(p));
  const secOn={about:P.plain.has('00_identity'),skills:P.skillsOn!==false,projects:hasProj,appendix:P.plain.has('90_appendix')};
  const section_order=(P.order||['about','skills','projects','appendix']).filter(t=>secOn[t]);
  return {name:$('#pName').value.trim(),target:$('#pTarget').value,lang:$('#pLang').value,
    emphasis:state.cat.angles.map(a=>a.id),
    skills_order:state.skillsOrder||[], skills_hidden:state.skillsHidden||[],
    resume:{include:rinc,project_order:rProj,project_angles:rAng,max_bullets_per_job:+$('#pMax').value,
      bullet_order:state.resume.bulletOrder||{},bullet_hidden:state.resume.bulletHidden||{}},
    portfolio:{include:pinc,project_angles:pAng,detail_level:$('#pDetail').value,section_order:section_order,
      bullet_order:state.portfolio.bulletOrder||{},bullet_hidden:state.portfolio.bulletHidden||{}}};
}

function applyProfile(name,p){
  $('#pName').value=name;$('#pTarget').value=p.target||'';$('#pLang').value=p.lang||'ko';
  $('#pDetail').value=(p.portfolio||{}).detail_level||'full';$('#pMax').value=(p.resume||{}).max_bullets_per_job??6;
  const R=state.resume,P=state.portfolio;
  const rinc=(p.resume||{}).include||[];
  R.plain=new Set(rinc.filter(s=>/00_identity|01_skills|02_education/.test(s)));
  R.exp=new Set(rinc.filter(s=>s.startsWith('10_experience/')));
  R.inc=new Set((p.resume||{}).project_order||[]);
  R.angles=Object.assign({},(p.resume||{}).project_angles||{});
  R.bulletOrder=Object.assign({},(p.resume||{}).bullet_order||{});
  R.bulletHidden=Object.assign({},(p.resume||{}).bullet_hidden||{}); R._openBlock=null;
  // 이력서 블록 순서 복원: include 순서 유지 + 누락된 기본 토큰은 뒤에 붙임
  const knownRes=rinc.filter(s=>/^(00_identity|01_skills|02_education)$/.test(s)||s.startsWith('10_experience/'));
  const allRes=['00_identity','01_skills','02_education',...state.cat.experiences.map(e=>e.sid)];
  R.order=[...knownRes,...allRes.filter(t=>!knownRes.includes(t))];
  P.plain=new Set(((p.portfolio||{}).include||[]).filter(s=>!s.startsWith('20_projects/')));
  const portIds=((p.portfolio||{}).include||[]).filter(s=>s.startsWith('20_projects/')).map(s=>s.split('/')[1]);
  P.inc=new Set(portIds);
  P.angles=Object.assign({},(p.portfolio||{}).project_angles||{});
  P.bulletOrder=Object.assign({},(p.portfolio||{}).bullet_order||{});
  P.bulletHidden=Object.assign({},(p.portfolio||{}).bullet_hidden||{}); P._openProj=null; P._openBlock=null;
  // 포폴 섹션 순서 복원: section_order 유지 + 누락된 기본 블록은 뒤에 붙임
  const secOrd=((p.portfolio||{}).section_order)||[], allPort=['about','skills','projects','appendix'];
  P.order=[...secOrd.filter(t=>allPort.includes(t)),...allPort.filter(t=>!secOrd.includes(t))];
  P.skillsOn=(secOrd.length? secOrd.includes('skills') : true);
  state.skillsOrder=(p.skills_order||[]).slice(); state.skillsHidden=(p.skills_hidden||[]).slice();
  const ro=(p.resume||{}).project_order||[], all=state.cat.projects.map(x=>x.id);
  state.projOrder=[...ro,...portIds.filter(x=>!ro.includes(x)),...all.filter(x=>!ro.includes(x)&&!portIds.includes(x))];
  renderAssemble();
  $('#asmMsg').textContent=`불러옴: ${name}`;
}

    return {inner:`<div class="page">${resumeInner(rs)}</div>`,fn:`resume_${lang}`,css:R1CSS};}
  const parts=(state.result.portfolio_parts||{})[lang]||[];
  const inner=`<div class="page">${md2html('# Portfolio')}</div>`+parts.map(p=>`<div class="page">${md2html(p.md)}</div>`).join('');
  return {inner,fn:`portfolio_${lang}`,css:''};
}
$('#exPrint').onclick=()=>{const kind=$('#pvKind').value,lang=$('#pvLang').value;
  let doc; if(kind==='resume'){const {inner,css}=currentDocParts();doc=docWrap(inner,'print',css);} else {doc=fancyPortfolioDoc(lang);}
  const w=window.open('','_print');w.document.write(doc);w.document.close();w.focus();setTimeout(()=>w.print(),350);};
$('#exDoc').onclick=async()=>{
  const kind=$('#pvKind').value, lang=$('#pvLang').value;
  if(kind==='resume'){
    // 진짜 .docx (Word 네이티브 서식 → Word/PDF 일관)
    const r=await fetch('/api/resume_docx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:currentProfile(),lang})});
    if(!r.ok){alert('docx 생성 실패');return;}
    const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`resume_${lang}.docx`;a.click();
  }else{
    const {inner,fn,css}=currentDocParts();download(fn+'.doc',docWrap(inner,fn,css),'application/msword');
  }
};
$('#exPptx').onclick=async()=>{
  const kind=$('#pvKind').value, lang=$('#pvLang').value;
  if(kind!=='portfolio'){alert('PPT는 포트폴리오만 지원합니다.');return;}
  let r;
  try{ r=await fetch('/api/portfolio_pptx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:currentProfile(),lang})}); }
  catch(e){ alert('PPT 생성 실패 — 서버에 연결할 수 없습니다. 서버를 실행했는지 확인하세요.'); return; }
  if(!r.ok){
    let detail=''; try{ const j=await r.json(); if(j&&j.error) detail=' — '+j.error; }catch(_){}
    if(/pptx|module/i.test(detail)) detail+='\n(서버에서 `pip install -r requirements.txt` 후 다시 실행해 주세요)';
    alert('PPT 생성 실패'+detail); return;
  }
  const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`portfolio_${lang}.pptx`;a.click();
};
$('#exHtml').onclick=()=>{const kind=$('#pvKind').value,lang=$('#pvLang').value;
  if(kind==='resume'){const {inner,fn,css}=currentDocParts();download(fn+'.html',docWrap(inner,fn,css),'text/html');}
  else download(`portfolio_${lang}.html`, fancyPortfolioDoc(lang),'text/html');};

/* ---------- tabs / init ---------- */
function switchTab(t){$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+t));}
$$('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function fillProfiles(){const sel=$('#pLoad');sel.innerHTML='<option value="">— 선택 —</option>';state.cat.profiles.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});}

async function init(){
  state.cat=await getJSON('/api/catalog');
  setStatus(`프로젝트 ${state.cat.projects.length} · 프로필 ${state.cat.profiles.length}`);
  buildFileList();
  state.resume={plain:new Set(['00_identity','01_skills','02_education']),exp:new Set(state.cat.experiences.map(e=>e.sid)),inc:new Set(),angles:{},
    order:['00_identity','01_skills',...state.cat.experiences.map(e=>e.sid),'02_education'],bulletOrder:{},bulletHidden:{},_openBlock:null};
  state.portfolio={plain:new Set(['00_identity','90_appendix']),inc:new Set(),angles:{},skillsOn:true,
    order:['about','skills','projects','appendix'],bulletOrder:{},bulletHidden:{},_openProj:null,_openBlock:null};
  state.skillsOrder=[]; state.skillsHidden=[];
  state.projOrder=state.cat.projects.map(p=>p.id);
  state.sub='resume';
  fillProfiles();renderAssemble();
}
init();
</script>
